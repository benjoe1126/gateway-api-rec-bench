scenarioTemplate: |
  {{ range .scenarios }}
  - name: simple-scenario-{{ .index }}
    description: {{ .description }}
    resources:
      {{- with .gwclasses }}
      gatewayClasses:
        count: {{ .count }}
        namingScheme: {{ .namingScheme }}
      {{- end }}
      {{- with .gateways }}
      gateways:
        count: {{ .count }}
        namingScheme: {{ .namingScheme }}
        distribution: {{ .distribution }}
      {{- end }}
    deltas:
      - selector:
          kind: Gateway
          name: simple-gateway-1
        patches:
          - op: replace
            path: /metadata/name
            value: "gateway"
  {{- end }}
values:
  scenarios:
    - index: 1
      description: some description 1
      gwclasses:
        count: 1
        namingScheme: gwclass
      gateways:
        count: 3
        namingScheme: gateway
        distribution: uniform
    - index: 2
      description: some description 2
      gwclasses:
        count: 1
        namingScheme: gwclass-second
      gateways:
        count: 6
        namingScheme: gateway-second
        distribution: random