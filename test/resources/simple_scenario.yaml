# yaml-language-server: $schema=../../scneario_schema.json
name: simple-scenario
description: some description
resources:
  gatewayClasses:
    count: 1
    namingScheme: gwclass
  gateways:
    count: 3
    namingScheme: simple-gateway
    distribution: uniform

deltas:
  - selector:
      kind: Gateway
      name: simple-gateway-1
      namespace: "gateway-system"
    patches:
      - op: replace
        path: /metadata/name
        value: "gateway"